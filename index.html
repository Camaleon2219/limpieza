<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Calendario de Trabajo</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #1a1a1a;
      font-size: 18px;
      line-height: 1.5;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 12px;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      margin: 12px 0 8px;
      font-weight: 600;
    }
    .subtitle {
      text-align: center;
      color: #555;
      font-size: 16px;
      margin-bottom: 16px;
    }
    /* Navegación del mes */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .month-nav button {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      min-width: 80px;
      min-height: 52px;
    }
    .month-nav button:active { opacity: 0.8; }
    .month-title {
      font-size: 22px;
      font-weight: 600;
    }
    /* Grid del calendario */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .day-header {
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: #666;
      padding: 8px 0;
    }
    .day-cell {
      aspect-ratio: 1;
      background: #fff;
      border: 2.5px solid #ddd;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: all 0.15s;
      position: relative;
      min-height: 56px;
    }
    .day-cell:hover, .day-cell:focus {
      border-color: #1a1a1a;
      outline: none;
    }
    .day-cell.selected {
      border-color: #1a1a1a;
      background: #e8e8e8;
      box-shadow: 0 0 0 3px #1a1a1a;
    }
    .day-cell.other-month {
      background: transparent;
      border-color: transparent;
      color: #bbb;
    }
    .day-num {
      font-size: 22px;
      font-weight: 600;
      line-height: 1;
    }
    .day-badge {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      margin-top: 4px;
    }
    .day-hours {
      font-size: 13px;
      font-weight: 600;
      color: #22c55e;
      margin-top: 2px;
    }
    /* Panel del día seleccionado */
    .day-panel {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .day-panel h2 {
      font-size: 24px;
      margin: 0 0 16px;
      font-weight: 600;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      border: 2.5px solid #ccc;
      border-radius: 12px;
      background: #fafafa;
      font-family: inherit;
      -webkit-appearance: none;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #1a1a1a;
      background: #fff;
    }
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 480px) {
      .two-col { grid-template-columns: 1fr; }
    }
    /* Símbolos grandes */
    .symbol-label {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .symbol-btn {
      border: 3px solid #ccc;
      border-radius: 14px;
      padding: 14px 4px;
      font-size: 42px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      transition: all 0.15s;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .symbol-btn:active { transform: scale(0.96); }
    .symbol-btn.picked {
      border-color: #1a1a1a;
      background: #d4d4d4;
      box-shadow: 0 0 0 3px #1a1a1a;
    }
    .symbol-caption {
      font-size: 12px;
      color: #555;
      margin-top: 4px;
      display: block;
      font-weight: 500;
    }
    /* Botón guardar */
    .btn-save {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 20px;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      font-family: inherit;
      min-height: 64px;
    }
    .btn-save:active { opacity: 0.85; }
    /* Lista de registros */
    .entries-title {
      font-size: 22px;
      font-weight: 600;
      margin: 20px 0 12px;
    }
    .entry-card {
      background: #fafafa;
      border: 2.5px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .entry-emoji {
      font-size: 48px;
      line-height: 1;
      min-width: 60px;
      text-align: center;
    }
    .entry-body {
      flex: 1;
    }
    .entry-activity {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .entry-meta {
      font-size: 17px;
      color: #555;
    }
    .entry-hours {
      font-size: 32px;
      font-weight: 700;
      white-space: nowrap;
      align-self: center;
    }
    .empty-msg {
      text-align: center;
      color: #777;
      font-size: 18px;
      padding: 28px 12px;
    }
    .btn-delete {
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    /* Resumen mensual */
    .summary-bar {
      background: #1a1a1a;
      color: #fff;
      border-radius: 14px;
      padding: 16px 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .summary-bar .big {
      font-size: 32px;
      font-weight: 700;
    }
    .summary-bar .small {
      font-size: 16px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📅 Mi Calendario de Trabajo</h1>
  <p class="subtitle">Anota cada día qué hiciste, dónde y cuántas horas</p>

  <div class="summary-bar" id="summaryBar">
    <div class="big" id="totalMonthHours">0 h</div>
    <div class="small">Horas este mes</div>
  </div>

  <div class="month-nav">
    <button onclick="changeMonth(-1)">◀ Mes</button>
    <div class="month-title" id="monthTitle">Agosto 2026</div>
    <button onclick="changeMonth(1)">Mes ▶</button>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>

  <div class="day-panel" id="dayPanel" style="display:none">
    <h2 id="dayTitle">Día seleccionado</h2>

    <div class="two-col">
      <div class="form-group">
        <label>¿Qué hiciste?</label>
        <input type="text" id="activity" placeholder="Ej: Pintar paredes">
      </div>
      <div class="form-group">
        <label>¿Dónde estuviste?</label>
        <input type="text" id="location" placeholder="Ej: Casa del Sr. López">
      </div>
    </div>

    <div class="two-col">
      <div class="form-group">
        <label>¿Cuántas horas?</label>
        <input type="number" id="hours" min="0" max="24" step="0.5" placeholder="Ej: 8">
      </div>
      <div class="form-group">
        <label>¿Cómo estuvo el día?</label>
        <div class="symbol-grid" id="symbolGrid"></div>
        <input type="hidden" id="pickedSymbol" value="">
      </div>
    </div>

    <button class="btn-save" onclick="saveEntry()">💾 Guardar registro</button>

    <div class="entries-title">Registros de este día:</div>
    <div id="entriesList"></div>
  </div>
</div>

<script>
  const SYMBOLS = [
    {emoji:'💪', text:'Trabajo fuerte'},
    {emoji:'😊', text:'Buen día'},
    {emoji:'😴', text:'Cansado'},
    {emoji:'🔥', text:'Mucho calor'},
    {emoji:'❄️', text:'Mucho frío'},
    {emoji:'⚠️', text:'Cuidado'},
    {emoji:'⭐', text:'Especial'},
    {emoji:'🏠', text:'En casa'}
  ];

  let currentDate = new Date();
  let selectedDateKey = null;
  let entries = {};

  function loadData() {
    const saved = localStorage.getItem('workCalendarEntries');
    if (saved) entries = JSON.parse(saved);
  }
  function saveData() {
    localStorage.setItem('workCalendarEntries', JSON.stringify(entries));
  }

  function initSymbols() {
    const grid = document.getElementById('symbolGrid');
    SYMBOLS.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className = 'symbol-btn';
      btn.innerHTML = `${s.emoji}<span class="symbol-caption">${s.text}</span>`;
      btn.onclick = () => pickSymbol(i, btn);
      grid.appendChild(btn);
    });
  }

  function pickSymbol(idx, btn) {
    document.getElementById('pickedSymbol').value = SYMBOLS[idx].emoji;
    document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('picked'));
    btn.classList.add('picked');
  }

  function getMonthData(y, m) {
    const first = new Date(y, m, 1);
    const startDay = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    return {startDay, daysInMonth};
  }

  function renderCalendar() {
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    document.getElementById('monthTitle').textContent = `${months[m]} ${y}`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'day-header';
      el.textContent = d;
      grid.appendChild(el);
    });

    const {startDay, daysInMonth} = getMonthData(y, m);

    for (let i = 0; i < startDay; i++) {
      const el = document.createElement('div');
      el.className = 'day-cell other-month';
      grid.appendChild(el);
    }

    let monthTotal = 0;

    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const dayEntries = entries[key] || [];
      const totalH = dayEntries.reduce((s, e) => s + (parseFloat(e.hours)||0), 0);
      monthTotal += totalH;

      const cell = document.createElement('button');
      cell.className = 'day-cell';
      if (key === selectedDateKey) cell.classList.add('selected');

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      cell.appendChild(num);

      if (dayEntries.length > 0) {
        cell.appendChild(document.createElement('div')).className = 'day-badge';
        const hrs = document.createElement('div');
        hrs.className = 'day-hours';
        hrs.textContent = totalH + 'h';
        cell.appendChild(hrs);
      }

      cell.onclick = () => openDay(key, d, m, y);
      grid.appendChild(cell);
    }

    document.getElementById('totalMonthHours').textContent = monthTotal + ' h';
  }

  function openDay(key, day, month, year) {
    selectedDateKey = key;
    const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    document.getElementById('dayTitle').textContent = `${day} de ${months[month]} de ${year}`;
    document.getElementById('dayPanel').style.display = 'block';
    document.getElementById('activity').value = '';
    document.getElementById('location').value = '';
    document.getElementById('hours').value = '';
    document.getElementById('pickedSymbol').value = '';
    document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('picked'));
    renderEntries();
    renderCalendar();
    document.getElementById('dayPanel').scrollIntoView({behavior:'smooth'});
  }

  function saveEntry() {
    const act = document.getElementById('activity').value.trim();
    const loc = document.getElementById('location').value.trim();
    const hrs = document.getElementById('hours').value.trim();
    const sym = document.getElementById('pickedSymbol').value;

    if (!act || !hrs) {
      alert('Escribe qué hiciste y cuántas horas trabajaste.');
      return;
    }

    if (!entries[selectedDateKey]) entries[selectedDateKey] = [];
    entries[selectedDateKey].push({
      activity: act,
      location: loc,
      hours: hrs,
      symbol: sym,
      id: Date.now()
    });

    saveData();
    document.getElementById('activity').value = '';
    document.getElementById('location').value = '';
    document.getElementById('hours').value = '';
    document.getElementById('pickedSymbol').value = '';
    document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('picked'));
    renderEntries();
    renderCalendar();
  }

  function deleteEntry(id) {
    if (!entries[selectedDateKey]) return;
    entries[selectedDateKey] = entries[selectedDateKey].filter(e => e.id !== id);
    if (entries[selectedDateKey].length === 0) delete entries[selectedDateKey];
    saveData();
    renderEntries();
    renderCalendar();
  }

  function renderEntries() {
    const list = document.getElementById('entriesList');
    const dayEntries = entries[selectedDateKey] || [];
    if (dayEntries.length === 0) {
      list.innerHTML = '<div class="empty-msg">Aún no hay registros para este día.<br>Toca los campos de arriba para agregar uno.</div>';
      return;
    }
    list.innerHTML = '';
    dayEntries.forEach(e => {
      const card = document.createElement('div');
      card.className = 'entry-card';

      const emoji = document.createElement('div');
      emoji.className = 'entry-emoji';
      emoji.textContent = e.symbol || '📝';
      card.appendChild(emoji);

      const body = document.createElement('div');
      body.className = 'entry-body';
      const act = document.createElement('div');
      act.className = 'entry-activity';
      act.textContent = e.activity;
      body.appendChild(act);
      const meta = document.createElement('div');
      meta.className = 'entry-meta';
      meta.textContent = [e.location ? '📍 ' + e.location : '', e.symbol ? e.symbol + ' ' + symbolText(e.symbol) : ''].filter(Boolean).join('  ·  ');
      body.appendChild(meta);

      const del = document.createElement('button');
      del.className = 'btn-delete';
      del.textContent = 'Borrar';
      del.onclick = () => deleteEntry(e.id);
      body.appendChild(del);

      card.appendChild(body);

      const hrs = document.createElement('div');
      hrs.className = 'entry-hours';
      hrs.textContent = e.hours + 'h';
      card.appendChild(hrs);

      list.appendChild(card);
    });
  }

  function symbolText(emoji) {
    const found = SYMBOLS.find(s => s.emoji === emoji);
    return found ? found.text : '';
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  loadData();
  initSymbols();
  renderCalendar();
</script>

</body>
</html>
